version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    post_checkout:
    - git fetch --tags --unshallow

sphinx:
  configuration: docs/conf.py

python:
  install:
  - method: pip
    path: .
